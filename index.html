<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geeseditz — Shorts</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --black:#080808;
  --white:#ffffff;
  --red:#e8001d;
  --red2:#ff1f3a;
  --gray:#888;
  --glass:rgba(255,255,255,0.10);
  --glass2:rgba(255,255,255,0.06);
}

html,body{
  height:100%;
  background:var(--black);
  color:var(--white);
  font-family:'Barlow',sans-serif;
  overflow:hidden;
  position:fixed;
  width:100%;
}

/* ── PHONE SHELL ── */
.shell{
  width:100%;
  max-width:420px;
  height:100vh;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:var(--black);
}

/* ── STATUS BAR ── */
.status-bar{
  position:absolute;
  top:0;left:0;right:0;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:50;
  pointer-events:none;
}
.status-time{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:0.5px;
  color:var(--white);
}
.status-icons{
  display:flex;
  align-items:center;
  gap:6px;
}
.status-icons svg{
  fill:var(--white);
}

/* ── TOP BAR ── */
.top-bar{
  position:absolute;
  top:36px;left:0;right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  z-index:40;
  background:linear-gradient(to bottom,rgba(0,0,0,0.55) 0%,transparent 100%);
}
.top-tabs{
  display:flex;
  align-items:center;
  gap:22px;
}
.top-tab{
  font-family:'Barlow Condensed',sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:0.5px;
  color:rgba(255,255,255,0.45);
  cursor:pointer;
  padding-bottom:3px;
  border-bottom:2px solid transparent;
  transition:color 0.2s,border-color 0.2s;
  user-select:none;
}
.top-tab.active{
  color:var(--white);
  border-bottom-color:var(--white);
}
.top-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  letter-spacing:3px;
  color:var(--white);
}
.top-logo span{color:var(--red);}
.top-vol{
  width:36px;height:36px;
  background:rgba(0,0,0,0.35);
  border:none;
  border-radius:50%;
  color:var(--white);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  transition:background 0.2s;
}
.top-vol:active{background:rgba(255,255,255,0.15);}
.top-vol svg{width:18px;height:18px;fill:var(--white);}

/* ── FEED ── */
.feed{
  width:100%;
  height:100%;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.feed::-webkit-scrollbar{display:none;}

/* ── SLIDE ── */
.slide{
  width:100%;
  height:100vh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  position:relative;
  overflow:hidden;
  background:var(--black);
}

/* Background thumbnail fills entire slide */
.slide-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  transition:transform 0.6s ease;
  filter:blur(0px);
}
.slide:hover .slide-bg{transform:scale(1.02);}

/* Layered gradients for depth */
.slide-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,  rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.3) 35%, transparent 55%),
    linear-gradient(to bottom,rgba(0,0,0,0.6) 0%, transparent 20%);
  z-index:2;
  pointer-events:none;
}

/* Red accent side bar */
.slide-accent{
  position:absolute;
  left:0;top:20%;bottom:20%;
  width:3px;
  background:linear-gradient(to bottom,transparent,var(--red),transparent);
  z-index:3;
  opacity:0.6;
}

/* Centered play button for clickable area */
.slide-tap{
  position:absolute;
  inset:0;
  z-index:5;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.play-ring{
  width:64px;height:64px;
  border-radius:50%;
  background:rgba(0,0,0,0.45);
  border:2px solid rgba(255,255,255,0.6);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:scale(0.7);
  transition:opacity 0.25s,transform 0.25s;
  pointer-events:none;
}
.play-ring svg{width:24px;height:24px;fill:white;margin-left:3px;}
.slide.paused .play-ring{opacity:1;transform:scale(1);}

/* ── BOTTOM INFO ── */
.slide-info{
  position:absolute;
  bottom:0;left:0;
  right:76px;
  padding:0 16px 32px;
  z-index:10;
}
.slide-channel{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.channel-avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:13px;
  letter-spacing:1px;
  color:var(--white);
  flex-shrink:0;
  border:2px solid rgba(255,255,255,0.3);
  overflow:hidden;
}
.channel-avatar img{width:100%;height:100%;object-fit:cover;}
.channel-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:0.3px;
  color:var(--white);
}
.channel-sub{
  font-size:11px;
  color:rgba(255,255,255,0.5);
  font-weight:400;
  margin-top:1px;
}
.follow-btn{
  margin-left:auto;
  padding:5px 14px;
  border-radius:2px;
  border:1.5px solid rgba(255,255,255,0.7);
  background:transparent;
  color:var(--white);
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
  flex-shrink:0;
}
.follow-btn.following{
  background:var(--red);
  border-color:var(--red);
}
.slide-category{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--red);
  margin-bottom:6px;
}
.slide-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:17px;
  font-weight:700;
  line-height:1.3;
  color:var(--white);
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-shadow:0 1px 12px rgba(0,0,0,0.7);
}

/* Progress dots */
.slide-progress{
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  display:flex;
  gap:2px;
  padding:0 3px;
  padding-top:3px;
  z-index:30;
}
.prog-seg{
  flex:1;
  height:3px;
  background:rgba(255,255,255,0.2);
  border-radius:2px;
  overflow:hidden;
}
.prog-fill{
  height:100%;
  border-radius:2px;
  background:var(--white);
  width:0%;
  transition:width 0.15s linear;
}
.prog-seg.done .prog-fill{width:100%;}
.prog-seg.active .prog-fill{background:var(--white);}

/* ── RIGHT ACTIONS ── */
.slide-actions{
  position:absolute;
  right:0;
  bottom:28px;
  width:72px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
  z-index:10;
  padding-right:10px;
}
.action-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  user-select:none;
}
.action-icon{
  width:46px;height:46px;
  background:rgba(255,255,255,0.12);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  transition:transform 0.15s,background 0.2s;
  border:1px solid rgba(255,255,255,0.08);
}
.action-icon:active{transform:scale(0.85);}
.action-icon svg{
  width:22px;height:22px;
  stroke:var(--white);
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.action-icon.liked svg{stroke:var(--red);fill:var(--red);}
.action-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.3px;
  color:rgba(255,255,255,0.85);
}

/* ── LOADING SCREEN ── */
.loading-screen{
  position:fixed;
  inset:0;
  background:var(--black);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:200;
  gap:20px;
  transition:opacity 0.5s;
}
.loading-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:48px;
  letter-spacing:6px;
  color:var(--white);
}
.loading-logo span{color:var(--red);}
.loading-bar{
  width:120px;
  height:2px;
  background:rgba(255,255,255,0.1);
  border-radius:2px;
  overflow:hidden;
}
.loading-bar-fill{
  height:100%;
  background:var(--red);
  border-radius:2px;
  width:0%;
  animation:loadFill 1.8s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes loadFill{
  0%{width:0%}
  60%{width:75%}
  100%{width:100%}
}
.loading-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.3);
}

/* ── ERROR STATE ── */
.error-slide{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:linear-gradient(135deg,#0d0d0d,#1a0000);
  padding:32px;
  text-align:center;
  z-index:10;
}
.error-line{
  width:40px;height:2px;
  background:var(--red);
  margin:0 auto;
}
.error-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  letter-spacing:2px;
  color:var(--white);
}
.error-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;
  letter-spacing:1px;
  color:rgba(255,255,255,0.4);
  line-height:1.6;
}
.error-link{
  display:inline-block;
  padding:12px 28px;
  border:1.5px solid var(--red);
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--white);
  text-decoration:none;
  margin-top:8px;
  transition:background 0.2s;
}
.error-link:hover{background:var(--red);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:absolute;
  bottom:0;left:0;right:0;
  height:60px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(16px);
  display:flex;
  align-items:center;
  justify-content:space-around;
  border-top:1px solid rgba(255,255,255,0.06);
  z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  padding:6px 14px;
  border-radius:8px;
  transition:background 0.2s;
}
.nav-item:active{background:rgba(255,255,255,0.07);}
.nav-item svg{
  width:22px;height:22px;
  stroke:rgba(255,255,255,0.4);
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke 0.2s;
}
.nav-item.active svg{stroke:var(--white);}
.nav-item span{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;
  letter-spacing:0.5px;
  font-weight:600;
  color:rgba(255,255,255,0.3);
  transition:color 0.2s;
}
.nav-item.active span{color:var(--white);}
.nav-item.active .nav-dot{
  width:4px;height:4px;
  border-radius:50%;
  background:var(--red);
  position:absolute;
  bottom:6px;
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loading">
  <div class="loading-logo">GEESE<span>DITZ</span></div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div class="loading-sub">Loading Shorts</div>
</div>

<div class="shell">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-time" id="status-time">9:30</div>
    <div class="status-icons">
      <!-- signal -->
      <svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4" y="4.5" width="3" height="6.5" rx="0.5"/><rect x="8" y="2" width="3" height="9" rx="0.5"/><rect x="12" y="0" width="3" height="11" rx="0.5" opacity="0.35"/></svg>
      <!-- wifi -->
      <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 8.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="white"/><path d="M3.5 5.5C4.9 4.1 6.1 3.5 7.5 3.5s2.6.6 4 2" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M1 3C2.9 1.1 5 0 7.5 0S12.1 1.1 14 3" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/></svg>
      <!-- battery -->
      <svg width="22" height="12" viewBox="0 0 22 12"><rect x="0.5" y="0.5" width="18" height="11" rx="2" stroke="white" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="13" height="8" rx="1" fill="white"/><path d="M19.5 4v4a1.5 1.5 0 000-4z" fill="white" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-tabs">
      <span class="top-tab" data-tab="following">Following</span>
      <span class="top-tab active" data-tab="foryou">For You</span>
    </div>
    <div class="top-logo">GEESE<span>DITZ</span></div>
    <button class="top-vol" id="vol-btn" title="Mute/Unmute">
      <svg id="vol-icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <!-- FEED -->
  <div class="feed" id="feed" style="padding-bottom:60px;">
    <!-- slides injected by JS -->
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="window.open('https://www.youtube.com/@Geeseditz','_blank')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="white" stroke="white"/></svg>
      <span>Shorts</span>
    </div>
    <div class="nav-item" onclick="window.open('https://www.youtube.com/@Geeseditz/shorts?sub_confirmation=1','_blank')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Subscribe</span>
    </div>
  </div>

</div>

<script>
// ── CONFIG ──
const CHANNEL_ID = 'UCYBD_DkYbf5J6kpAZKEi9VA';
const CHANNEL_NAME = 'Geeseditz';
const PROXY = 'https://api.allorigins.win/get?url=';
const RSS = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;

let muted = false;
let currentSlide = 0;
let liked = {};
let following = {};
let slidesData = [];

// ── STATUS TIME ──
function updateTime() {
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes();
  document.getElementById('status-time').textContent =
    h + ':' + String(m).padStart(2,'0');
}
updateTime();
setInterval(updateTime, 15000);

// ── VOLUME ──
const volBtn = document.getElementById('vol-btn');
const volIcon = document.getElementById('vol-icon');
const VOL_ON = `<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>`;
const VOL_OFF = `<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>`;
volBtn.addEventListener('click', () => {
  muted = !muted;
  volIcon.innerHTML = muted ? VOL_OFF : VOL_ON;
});

// ── FORMAT ──
function fmtViews(n) {
  if (!n || isNaN(n)) return '';
  n = parseInt(n);
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M views';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K views';
  return n.toLocaleString() + ' views';
}
function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str);
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return '1 day ago';
  if (diff < 7) return diff + ' days ago';
  if (diff < 30) return Math.floor(diff/7) + 'w ago';
  if (diff < 365) return Math.floor(diff/30) + 'mo ago';
  return Math.floor(diff/365) + 'y ago';
}

// ── RENDER SLIDES ──
function renderSlides(items) {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  const count = items.length;

  items.forEach((item, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.id = `slide-${i}`;

    // Progress segments
    const progSegs = items.map((_, j) =>
      `<div class="prog-seg ${j < i ? 'done' : j === i ? 'active' : ''}" id="seg-${i}-${j}">
        <div class="prog-fill" id="segfill-${i}-${j}" style="${j<i?'width:100%':''}"></div>
      </div>`
    ).join('');

    // Fake stats for UI completeness
    const likes = item.likes || (Math.floor(Math.random()*50+5)) + 'K';
    const comments = item.comments || (Math.floor(Math.random()*20+1)) + 'K';
    const shares = item.shares || (Math.floor(Math.random()*10+1)) + 'K';

    slide.innerHTML = `
      <!-- Background image -->
      <div class="slide-bg" id="bg-${i}"
        style="background-image:url('${item.thumb}')">
      </div>

      <div class="slide-overlay"></div>
      <div class="slide-accent"></div>

      <!-- Progress -->
      <div class="slide-progress">${progSegs}</div>

      <!-- Tap to open YouTube -->
      <div class="slide-tap" data-url="${item.url}" data-idx="${i}">
        <div class="play-ring">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
      </div>

      <!-- Info -->
      <div class="slide-info">
        <div class="slide-channel">
          <div class="channel-avatar">
            <img src="https://yt3.googleusercontent.com/ytc/AIdro_nVGLBkCcDzGI-qYAqfQmKSbUPwSMHVhm3-cWs2XY0g=s68-c-k-c0x00ffffff-no-rj"
              alt="Geeseditz"
              onerror="this.style.display='none';this.parentElement.textContent='GD';">
          </div>
          <div>
            <div class="channel-name">@${CHANNEL_NAME}</div>
            <div class="channel-sub">${item.dateStr}</div>
          </div>
          <button class="follow-btn ${following[i] ? 'following' : ''}" data-follow="${i}">
            ${following[i] ? 'Following' : 'Follow'}
          </button>
        </div>
        <div class="slide-category">Football Edit</div>
        <div class="slide-title">${item.title}</div>
        ${item.views ? `<div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.45);margin-top:6px;text-transform:uppercase;">${item.views}</div>` : ''}
      </div>

      <!-- Actions -->
      <div class="slide-actions">
        <div class="action-btn" data-like="${i}">
          <div class="action-icon ${liked[i]?'liked':''}" id="like-icon-${i}">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          </div>
          <span class="action-label" id="like-count-${i}">${likes}</span>
        </div>
        <div class="action-btn" data-url="${item.url}">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <span class="action-label">${comments}</span>
        </div>
        <div class="action-btn" data-url="${item.url}">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </div>
          <span class="action-label">${shares}</span>
        </div>
        <div class="action-btn" data-url="${item.url}">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
          </div>
          <span class="action-label">YouTube</span>
        </div>
      </div>
    `;
    feed.appendChild(slide);
  });

  // Bind events
  bindEvents(items, count);
}

function bindEvents(items, count) {
  // Slide tap — open video
  document.querySelectorAll('.slide-tap').forEach(el => {
    let tapTimer;
    el.addEventListener('click', e => {
      const idx = parseInt(el.dataset.idx);
      // Single tap: toggle pause visual (no real video, just thumbnail)
      const slide = document.getElementById(`slide-${idx}`);
      slide.classList.toggle('paused');
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => slide.classList.remove('paused'), 2000);
    });
    el.addEventListener('dblclick', e => {
      window.open(el.dataset.url, '_blank');
    });
  });

  // Open YouTube on action btns with data-url
  document.querySelectorAll('[data-url]').forEach(el => {
    if (el.classList.contains('slide-tap')) return;
    el.addEventListener('click', e => {
      e.stopPropagation();
      window.open(el.dataset.url, '_blank');
    });
  });

  // Like
  document.querySelectorAll('[data-like]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(el.dataset.like);
      liked[i] = !liked[i];
      const icon = document.getElementById(`like-icon-${i}`);
      if (icon) icon.classList.toggle('liked', liked[i]);
      // Haptic bump
      if (navigator.vibrate) navigator.vibrate(30);
    });
  });

  // Follow
  document.querySelectorAll('[data-follow]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(el.dataset.follow);
      following[i] = !following[i];
      el.textContent = following[i] ? 'Following' : 'Follow';
      el.classList.toggle('following', following[i]);
    });
  });

  // Tabs
  document.querySelectorAll('.top-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });

  // Scroll snap — update progress bars
  const feed = document.getElementById('feed');
  let lastSlide = 0;
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = parseInt(entry.target.id.replace('slide-',''));
      currentSlide = idx;
      // Mark previous segs done, current active
      items.forEach((_, j) => {
        for (let k = 0; k < items.length; k++) {
          const seg = document.getElementById(`seg-${idx}-${k}`);
          const fill = document.getElementById(`segfill-${idx}-${k}`);
          if (!seg || !fill) continue;
          if (k < idx) { fill.style.width = '100%'; }
          else if (k === idx) { fill.style.width = '0%'; startFill(idx, idx); }
          else { fill.style.width = '0%'; }
        }
      });
    });
  }, { threshold: 0.65 });

  for (let i = 0; i < items.length; i++) {
    const s = document.getElementById(`slide-${i}`);
    if (s) io.observe(s);
  }
}

// Animate progress fill on active slide (simulated, no real video)
let fillTimers = {};
function startFill(slideIdx, segIdx) {
  clearTimeout(fillTimers[slideIdx]);
  const fill = document.getElementById(`segfill-${slideIdx}-${slideIdx}`);
  if (!fill) return;
  let pct = 0;
  const interval = setInterval(() => {
    pct += 0.5;
    fill.style.width = Math.min(pct, 100) + '%';
    if (pct >= 100) clearInterval(interval);
  }, 80); // ~16s to complete
  fillTimers[slideIdx] = interval;
}

// ── FETCH RSS ──
async function loadShorts() {
  try {
    const res = await fetch(PROXY + encodeURIComponent(RSS), {
      signal: AbortSignal.timeout(10000)
    });
    const data = await res.json();
    const xml = new DOMParser().parseFromString(data.contents, 'text/xml');
    const entries = Array.from(xml.querySelectorAll('entry'));

    if (!entries.length) throw new Error('empty feed');

    const items = entries.slice(0, 12).map(e => {
      const videoId = e.querySelector('videoId')?.textContent || '';
      const title = e.querySelector('title')?.textContent || 'Football Edit';
      const views = e.querySelector('statistics')?.getAttribute('views') || '';
      const published = e.querySelector('published')?.textContent || '';

      // Use maxresdefault, fall back via onerror in HTML
      const thumb = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
      const thumbFallback = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
      const url = `https://www.youtube.com/shorts/${videoId}`;

      return {
        videoId, title, thumb, thumbFallback, url,
        views: fmtViews(views),
        dateStr: fmtDate(published),
        likes: null, comments: null, shares: null,
      };
    });

    renderSlides(items);
    dismiss();
  } catch(err) {
    // Fallback: show error slide + direct link
    renderError();
    dismiss();
  }
}

function renderError() {
  const feed = document.getElementById('feed');
  feed.innerHTML = `
    <div class="slide">
      <div class="error-slide">
        <div class="error-line"></div>
        <div class="error-title">Could Not Load Feed</div>
        <div class="error-sub">The RSS proxy is unavailable.<br>View shorts directly on YouTube.</div>
        <a class="error-link" href="https://www.youtube.com/@Geeseditz/shorts" target="_blank">
          Open YouTube Channel
        </a>
      </div>
    </div>
  `;
}

function dismiss() {
  const loading = document.getElementById('loading');
  if (!loading) return;
  loading.style.opacity = '0';
  setTimeout(() => loading.remove(), 500);
}

// ── INIT ──
loadShorts();
</script>
