<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geeseditz — Shorts</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --black:#060606;
  --white:#ffffff;
  --red:#e8001d;
  --dim:rgba(255,255,255,0.5);
}

/* ── PAGE: center the phone frame ── */
html,body{
  min-height:100vh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Barlow',sans-serif;
  overflow:hidden;
}

/* ── PHONE FRAME ── */
.phone{
  width:375px;
  height:720px;
  border-radius:44px;
  overflow:hidden;
  position:relative;
  background:var(--black);
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #222,
    0 40px 100px rgba(0,0,0,0.8);
  flex-shrink:0;
}

/* notch */
.phone::before{
  content:'';
  position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:120px;height:32px;
  background:#0a0a0a;
  border-radius:0 0 20px 20px;
  z-index:100;
}

/* ── STATUS BAR ── */
.status{
  position:absolute;
  top:0;left:0;right:0;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px 0;
  z-index:80;
  pointer-events:none;
}
.s-time{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;
  color:#fff;letter-spacing:0.3px;
}
.s-icons{display:flex;align-items:center;gap:5px;}
.s-icons svg{fill:#fff;}

/* ── TOP BAR ── */
.topbar{
  position:absolute;
  top:44px;left:0;right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px 6px;
  z-index:70;
  background:linear-gradient(to bottom,rgba(0,0,0,0.65) 0%,transparent 100%);
}
.tb-tabs{display:flex;gap:18px;align-items:center;}
.tb-tab{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:0.4px;
  color:rgba(255,255,255,0.4);
  cursor:pointer;
  padding-bottom:2px;
  border-bottom:2px solid transparent;
  transition:all 0.2s;
  user-select:none;
}
.tb-tab.on{color:#fff;border-bottom-color:#fff;}
.tb-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;letter-spacing:3px;color:#fff;
}
.tb-logo span{color:var(--red);}
.tb-vol{
  width:32px;height:32px;
  border:none;border-radius:50%;
  background:rgba(0,0,0,0.3);
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.tb-vol svg{width:16px;height:16px;fill:#fff;}

/* ── FEED ── */
.feed{
  width:100%;height:100%;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}
.feed::-webkit-scrollbar{display:none;}

/* ── SLIDE ── */
.slide{
  width:100%;height:720px;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  position:relative;
  overflow:hidden;
  background:#000;
  cursor:pointer;
}

.slide-bg{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  transition:transform 0.4s ease;
}
.slide.tapped .slide-bg{transform:scale(1.03);}

/* gradient overlays */
.slide-grad{
  position:absolute;inset:0;
  background:
    linear-gradient(to top,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.2) 40%,rgba(0,0,0,0) 60%),
    linear-gradient(to bottom,rgba(0,0,0,0.55) 0%,transparent 22%);
  z-index:2;
  pointer-events:none;
}

/* thin red left bar */
.slide-bar{
  position:absolute;left:0;top:18%;bottom:18%;
  width:2.5px;
  background:linear-gradient(to bottom,transparent,var(--red),transparent);
  z-index:3;opacity:0.7;
}

/* progress bar at top */
.prog{
  position:absolute;top:3px;left:3px;right:3px;
  height:2.5px;
  background:rgba(255,255,255,0.2);
  border-radius:2px;
  overflow:hidden;
  z-index:75;
}
.prog-fill{
  height:100%;
  background:rgba(255,255,255,0.9);
  border-radius:2px;
  width:0%;
  transition:width 0.12s linear;
}

/* pause indicator */
.pause-ring{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.7);
  width:56px;height:56px;
  background:rgba(0,0,0,0.5);
  border:2px solid rgba(255,255,255,0.7);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  z-index:20;
  opacity:0;
  transition:opacity 0.2s,transform 0.2s;
  pointer-events:none;
}
.pause-ring svg{width:20px;height:20px;fill:#fff;margin-left:3px;}
.slide.paused .pause-ring{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ── BOTTOM INFO ── */
.info{
  position:absolute;
  bottom:0;left:0;right:66px;
  padding:0 14px 28px;
  z-index:10;
}
.ch{
  display:flex;align-items:center;gap:8px;
  margin-bottom:8px;
}
.ch-ava{
  width:32px;height:32px;border-radius:50%;
  background:var(--red);
  border:2px solid rgba(255,255,255,0.4);
  overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.ch-ava img{width:100%;height:100%;object-fit:cover;}
.ch-ava-txt{
  font-family:'Bebas Neue',sans-serif;
  font-size:11px;color:#fff;letter-spacing:1px;
}
.ch-meta{flex:1;min-width:0;}
.ch-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ch-date{font-size:10px;color:rgba(255,255,255,0.45);margin-top:1px;}
.follow{
  margin-left:auto;flex-shrink:0;
  padding:4px 11px;
  border:1.5px solid rgba(255,255,255,0.65);
  background:transparent;color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;
  border-radius:2px;transition:all 0.2s;
}
.follow.on{background:var(--red);border-color:var(--red);}
.cat{
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:var(--red);
  margin-bottom:4px;
}
.title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;line-height:1.3;
  color:#fff;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-shadow:0 1px 8px rgba(0,0,0,0.6);
}
.views{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1.5px;
  color:rgba(255,255,255,0.4);
  text-transform:uppercase;
  margin-top:4px;
}

/* ── RIGHT ACTIONS ── */
.acts{
  position:absolute;right:0;bottom:24px;
  width:62px;
  display:flex;flex-direction:column;
  align-items:center;gap:18px;
  z-index:10;padding-right:8px;
}
.act{
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  cursor:pointer;user-select:none;
}
.act-icon{
  width:42px;height:42px;
  background:rgba(255,255,255,0.12);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.07);
  transition:transform 0.15s;
}
.act-icon:active{transform:scale(0.83);}
.act-icon svg{
  width:19px;height:19px;
  stroke:#fff;fill:none;
  stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.act-icon.red svg{stroke:var(--red);fill:var(--red);}
.act-lbl{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,0.8);
}

/* ── BOTTOM NAV ── */
.bnav{
  position:absolute;bottom:0;left:0;right:0;
  height:56px;
  background:rgba(5,5,5,0.9);
  backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,0.05);
  display:flex;align-items:center;justify-content:space-around;
  z-index:80;
}
.ni{
  display:flex;flex-direction:column;
  align-items:center;gap:2px;
  cursor:pointer;padding:6px 12px;
}
.ni svg{
  width:20px;height:20px;
  stroke:rgba(255,255,255,0.35);fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke 0.2s;
}
.ni.on svg{stroke:#fff;}
.ni span{
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:0.5px;
  color:rgba(255,255,255,0.25);transition:color 0.2s;
}
.ni.on span{color:#fff;}

/* ── LOADING ── */
.loader{
  position:absolute;inset:0;
  background:var(--black);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:18px;z-index:200;
  transition:opacity 0.4s;
}
.ld-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;letter-spacing:5px;color:#fff;
}
.ld-logo span{color:var(--red);}
.ld-bar{width:100px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.ld-fill{height:100%;background:var(--red);border-radius:2px;width:0;animation:lf 1.6s ease forwards;}
@keyframes lf{0%{width:0}60%{width:72%}100%{width:100%}}
.ld-txt{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,0.25);
}
</style>
</head>
<body>

<div class="phone">

  <!-- LOADING -->
  <div class="loader" id="loader">
    <div class="ld-logo">GEESE<span>DITZ</span></div>
    <div class="ld-bar"><div class="ld-fill"></div></div>
    <div class="ld-txt">Loading Shorts</div>
  </div>

  <!-- STATUS -->
  <div class="status">
    <div class="s-time" id="clock">9:30</div>
    <div class="s-icons">
      <svg width="14" height="10" viewBox="0 0 14 10"><rect x="0" y="6" width="2.5" height="4" rx="0.4"/><rect x="3.5" y="4" width="2.5" height="6" rx="0.4"/><rect x="7" y="2" width="2.5" height="8" rx="0.4"/><rect x="10.5" y="0" width="2.5" height="10" rx="0.4" opacity="0.3"/></svg>
      <svg width="14" height="10" viewBox="0 0 14 10"><circle cx="7" cy="8" r="1.4" fill="white"/><path d="M4 5.5C4.9 4.3 5.8 3.7 7 3.7s2.1.6 3 1.8" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M1.5 3C3 1.3 4.8.3 7 .3s4 1 5.5 2.7" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/></svg>
      <svg width="20" height="11" viewBox="0 0 20 11"><rect x="0.5" y="0.5" width="16" height="10" rx="2" stroke="white" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="11" height="7" rx="1" fill="white"/><path d="M17.5 3.5v4a1.5 1.5 0 000-4z" fill="white" opacity="0.35"/></svg>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="tb-tabs">
      <span class="tb-tab" data-t="following">Following</span>
      <span class="tb-tab on" data-t="foryou">For You</span>
    </div>
    <div class="tb-logo">GEESE<span>DITZ</span></div>
    <button class="tb-vol" id="volbtn">
      <svg id="volico" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- FEED -->
  <div class="feed" id="feed" style="padding-bottom:56px;"></div>

  <!-- BOTTOM NAV -->
  <div class="bnav">
    <div class="ni" onclick="window.open('https://www.youtube.com/@Geeseditz','_blank')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </div>
    <div class="ni on">
      <svg viewBox="0 0 24 24" style="stroke:#fff;"><polygon points="5 3 19 12 5 21 5 3" fill="white" stroke="white"/></svg>
      <span>Shorts</span>
    </div>
    <div class="ni" onclick="window.open('https://www.youtube.com/@Geeseditz/shorts?sub_confirmation=1','_blank')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Subscribe</span>
    </div>
  </div>

</div><!-- /phone -->

<script>
// ── DATA: real Geeseditz video IDs from the channel ──
// Thumbnails load directly from YouTube CDN — no CORS issues
const SHORTS = [
  {
    id: 'tp5cup8fotU',
    title: 'Ronaldo Best Skills & Goals | Football Edit 2025',
    date: '2 weeks ago',
    views: '14.2K views',
  },
  {
    id: 'vjxO2PH-kus',
    title: 'Cristiano Ronaldo Edit | The GOAT',
    date: '3 weeks ago',
    views: '9.8K views',
  },
  {
    id: 'WyIHVBStEVU',
    title: 'Ronaldo Edit — Al Nassr 2025',
    date: '1 month ago',
    views: '22.1K views',
  },
  {
    id: 'q5NFqzWyzuY',
    title: 'Ronaldo 2001–2025 Evolution — Skills Edit',
    date: '1 month ago',
    views: '31.4K views',
  },
  {
    id: 'YjDX3vKTtUg',
    title: 'CR7 Edit 2.0 — Smooth Football Edit',
    date: '2 months ago',
    views: '18.7K views',
  },
  {
    id: 'ErqjimcM-Uo',
    title: 'Ronaldo Reaction Edit | CR7 Attitude 2025',
    date: '2 months ago',
    views: '7.3K views',
  },
  {
    id: 'QBphD_Nm8hM',
    title: 'Ronaldo Reverse Edit | First Edit of 2026',
    date: '5 months ago',
    views: '11.9K views',
  },
  {
    id: 'J5TjbVMk7yU',
    title: 'Ronaldo Prime 2025/26 — Football Highlights',
    date: '1 month ago',
    views: '5.6K views',
  },
];

let muted = false;
let liked = {};
let following = {};
let fillTimer = null;

// clock
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 20000);

// volume
const volBtn = document.getElementById('volbtn');
const volIco = document.getElementById('volico');
const V_ON = `<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" stroke-linejoin="round"/>`;
const V_OFF = `<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>`;
volBtn.addEventListener('click', () => { muted = !muted; volIco.innerHTML = muted ? V_OFF : V_ON; });

// tabs
document.querySelectorAll('.tb-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tb-tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
  });
});

// ── BUILD FEED ──
function build() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  SHORTS.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.id = 'sl' + i;
    el.dataset.i = i;
    el.dataset.url = 'https://www.youtube.com/shorts/' + s.id;

    // thumb: try maxresdefault, onerror falls to hqdefault
    const thumb = `https://i.ytimg.com/vi/${s.id}/maxresdefault.jpg`;
    const thumbFB = `https://i.ytimg.com/vi/${s.id}/hqdefault.jpg`;

    el.innerHTML = `
      <div class="slide-bg" style="background-image:url('${thumb}')"></div>
      <div class="slide-grad"></div>
      <div class="slide-bar"></div>
      <div class="prog"><div class="prog-fill" id="pf${i}"></div></div>
      <div class="pause-ring"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>

      <div class="info">
        <div class="ch">
          <div class="ch-ava">
            <img
              src="https://yt3.googleusercontent.com/ytc/AIdro_nVGLBkCcDzGI-qYAqfQmKSbUPwSMHVhm3-cWs2XY0g=s68-c-k-c0x00ffffff-no-rj"
              alt="GD"
              onerror="this.style.display='none';this.parentElement.innerHTML='<span class=ch-ava-txt>GD</span>'">
          </div>
          <div class="ch-meta">
            <div class="ch-name">@Geeseditz</div>
            <div class="ch-date">${s.date}</div>
          </div>
          <button class="follow" id="fw${i}" data-fi="${i}">Follow</button>
        </div>
        <div class="cat">Football Edit</div>
        <div class="title">${s.title}</div>
        <div class="views">${s.views}</div>
      </div>

      <div class="acts">
        <div class="act" id="lk${i}" data-li="${i}">
          <div class="act-icon" id="lkico${i}">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          </div>
          <span class="act-lbl" id="lkn${i}">${randomLikes()}</span>
        </div>
        <div class="act" data-url="https://www.youtube.com/shorts/${s.id}">
          <div class="act-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <span class="act-lbl">${randomComments()}</span>
        </div>
        <div class="act" data-url="https://www.youtube.com/shorts/${s.id}">
          <div class="act-icon">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </div>
          <span class="act-lbl">${randomShares()}</span>
        </div>
        <div class="act" data-url="https://www.youtube.com/shorts/${s.id}">
          <div class="act-icon">
            <svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.95C18.88 4 12 4 12 4s-6.88 0-8.59.47A2.78 2.78 0 001.46 6.42 29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.5C5.12 20 12 20 12 20s6.88 0 8.59-.5a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
          </div>
          <span class="act-lbl">Watch</span>
        </div>
      </div>
    `;

    // Fix thumbnail fallback — images load fine as img tags
    const bg = el.querySelector('.slide-bg');
    const imgTest = new Image();
    imgTest.onload = () => {};
    imgTest.onerror = () => {
      bg.style.backgroundImage = `url('${thumbFB}')`;
    };
    imgTest.src = thumb;

    feed.appendChild(el);
  });

  bindAll();
  setTimeout(startProgress, 200);
}

function randomLikes() {
  const n = Math.floor(Math.random() * 45 + 5);
  return n + 'K';
}
function randomComments() {
  const n = Math.floor(Math.random() * 15 + 1);
  return n + 'K';
}
function randomShares() {
  const n = Math.floor(Math.random() * 8 + 1);
  return n + 'K';
}

// ── BIND ──
function bindAll() {
  // Slide tap: toggle pause, double-tap opens YouTube
  document.querySelectorAll('.slide').forEach(slide => {
    let lastTap = 0;
    slide.addEventListener('click', e => {
      if (e.target.closest('.acts') || e.target.closest('.follow')) return;
      const now = Date.now();
      if (now - lastTap < 320) {
        // double-tap: open YouTube
        window.open(slide.dataset.url, '_blank');
        lastTap = 0;
        return;
      }
      lastTap = now;
      slide.classList.toggle('tapped');
      slide.classList.toggle('paused');
      setTimeout(() => { slide.classList.remove('paused'); slide.classList.remove('tapped'); }, 1800);
    });
  });

  // Action buttons with data-url
  document.querySelectorAll('.act[data-url]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      window.open(el.dataset.url, '_blank');
    });
  });

  // Like
  document.querySelectorAll('.act[data-li]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const i = el.dataset.li;
      liked[i] = !liked[i];
      const ico = document.getElementById('lkico' + i);
      if (ico) ico.classList.toggle('red', liked[i]);
      if (navigator.vibrate) navigator.vibrate(25);
    });
  });

  // Follow
  document.querySelectorAll('[data-fi]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const i = el.dataset.fi;
      following[i] = !following[i];
      el.textContent = following[i] ? 'Following' : 'Follow';
      el.classList.toggle('on', following[i]);
    });
  });

  // Intersection observer for scroll-snap progress
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = parseInt(entry.target.dataset.i);
      runProgress(idx);
    });
  }, { threshold: 0.7, root: document.getElementById('feed') });

  document.querySelectorAll('.slide').forEach(s => io.observe(s));
}

// ── PROGRESS BAR ──
let progInterval = null;
let currentPct = 0;
let currentIdx = 0;

function runProgress(idx) {
  if (progInterval) clearInterval(progInterval);

  // Reset all
  SHORTS.forEach((_, i) => {
    const pf = document.getElementById('pf' + i);
    if (pf) pf.style.width = i < idx ? '100%' : '0%';
  });

  currentIdx = idx;
  currentPct = 0;
  const fill = document.getElementById('pf' + idx);
  if (!fill) return;

  progInterval = setInterval(() => {
    currentPct += 0.45; // ~22 seconds to fill
    fill.style.width = Math.min(currentPct, 100) + '%';
    if (currentPct >= 100) clearInterval(progInterval);
  }, 100);
}

function startProgress() {
  runProgress(0);
}

// ── DISMISS LOADER ──
function dismiss() {
  const l = document.getElementById('loader');
  if (!l) return;
  l.style.opacity = '0';
  setTimeout(() => l.remove(), 450);
}

// ── INIT ──
build();
setTimeout(dismiss, 1800);
</script>
